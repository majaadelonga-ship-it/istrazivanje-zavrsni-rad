    // ne bi mogao gumbom "natrag" vratiti na ovu stranicu.

      var grupa = Math.random() < 0.5 ? "a" : "b";
      var odrediste = grupa === "a" ? "verzija-a/index.html" : "verzija-b/index.html";
      window.location.replace(odrediste);
    })();
  </script>
</head>
